# Builds a release from every push to master and delivers it:
#   1. the server (static Linux binary) to the VPS, with rollback if it does not start
#   2. the signed Windows installer to the server's update folder, from where
#      installed clients update themselves
#   3. the website (website/) with the newest installer and quick helper
#   4. on request (run by hand with "store" ticked) the MSIX to the Microsoft Store
# One-time setup (secrets, variables, server): docs/DEPLOY.md. Without the
# secrets the builds still run and the files are kept as workflow artifacts.
name: Release

# Pure documentation changes need no new release.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      store:
        description: "Auch im Microsoft Store einreichen"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # major.minor from the workspace, the run number as patch: always increasing.
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+)\..*/\1.\2/')
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  server:
    needs: version
    runs-on: ubuntu-latest
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # The mail transport's TLS (ring) compiles C code for the static build.
      - name: musl-Compiler
        run: sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked -p ctxremote-proto -p ctxremote-server
      - name: Server (statisch)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p ctxremote-server --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: target/x86_64-unknown-linux-musl/release/ctxremote-server

  client:
    needs: version
    runs-on: windows-latest
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      # Built into the clients: where they connect and which key updates must carry.
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      # The server's tunnel key: connections to the server are encrypted (docs/DEPLOY.md).
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: Dienst
        working-directory: app
        run: node scripts/prepare-service.mjs
      - name: Installer
        working-directory: app
        shell: bash
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --config src-tauri/tauri.version.json
          # Kept for the MSIX: the quick helper's build reuses target/release.
          mkdir -p ../msix-bin
          cp ../target/release/Remocto.exe ../msix-bin/remocto.exe
          cp ../target/release/remocto-service.exe ../msix-bin/
      - name: Schnellhilfe
        if: vars.CTXREMOTE_SERVER != ''
        working-directory: app
        shell: bash
        env:
          CTXREMOTE_QUICK_SERVER: ${{ vars.CTXREMOTE_SERVER }}
        run: npm run build:quick -- --config src-tauri/tauri.version.json
      # The setup window for downloads (crates/setup) carries the NSIS
      # installer inside; automatic updates keep using the NSIS installer.
      - name: Setup-Fenster
        shell: bash
        run: |
          nsis=$(ls target/release/bundle/nsis/*-setup.exe)
          CTXREMOTE_SETUP_PAYLOAD="$PWD/$nsis" cargo build --release --locked -p ctxremote-setup
      - name: Dateien einsammeln
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe "out/Remocto-$CTXREMOTE_VERSION-setup.exe"
          cp target/release/Remocto-Setup.exe out/Remocto-Setup.exe
          if [ -f target/release/Remocto-Hilfe.exe ]; then cp target/release/Remocto-Hilfe.exe out/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: out/
      # The same app and service as an MSIX package for the Microsoft Store
      # (docs/DEPLOY.md). Still new: a failure must not hold back the release.
      - name: MSIX
        id: msix
        continue-on-error: true
        shell: pwsh
        env:
          MSIX_CERT: ${{ secrets.MSIX_CERT }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
        run: >-
          ./app/msix/build-msix.ps1 -Version $env:CTXREMOTE_VERSION -BinDir msix-bin -OutDir msix
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'CTXRemote' }}"
          -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=Remocto Test' }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Remocto' }}"
          -CertBase64 "$env:MSIX_CERT" -CertPassword "$env:MSIX_CERT_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: steps.msix.outcome == 'success'
        with:
          name: client-msix
          path: msix/

  # The macOS app as a disk image, for Apple silicon and Intel. Not signed or
  # notarised yet (needs an Apple developer account): on first start macOS
  # asks to confirm it (right-click → Open).
  client-macos:
    needs: version
    runs-on: macos-latest
    # Still new: a failing Mac build must not hold back the Windows release.
    continue-on-error: true
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: App
        working-directory: app
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.version.json
      - name: Dateien einsammeln
        run: |
          mkdir out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Remocto.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: out/

  # Linux: an AppImage (runs on most distributions) and a .deb. Built on the
  # oldest supported Ubuntu, so the AppImage also runs on older systems.
  client-linux:
    needs: version
    runs-on: ubuntu-22.04
    # Still new: a failing Linux build must not hold back the Windows release.
    continue-on-error: true
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: App
        working-directory: app
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --config src-tauri/tauri.version.json
      - name: Dateien einsammeln
        run: |
          mkdir out
          cp target/release/bundle/appimage/*.AppImage out/Remocto.AppImage
          cp target/release/bundle/deb/*.deb out/remocto.deb
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: out/

  # Android: an app bundle (.aab) for Google Play and an installable APK, both
  # pointing at the project's server. The run number is the versionCode, so
  # every release can be uploaded. The bundle is only built with the real key
  # (secrets ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD): the first upload
  # fixes Play's upload key, a throwaway key there would lock us out.
  client-android:
    needs: version
    runs-on: ubuntu-latest
    # Still new: a failing Android build must not hold back the Windows release.
    continue-on-error: true
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Android-Projekt anlegen
        working-directory: app
        run: npx tauri android init --ci
      - name: App-Bundle und APK
        working-directory: app
        run: |
          printf '{"version":"%s","bundle":{"android":{"versionCode":%s}}}' \
            "$CTXREMOTE_VERSION" "${{ github.run_number }}" > src-tauri/tauri.version.json
          formats="--apk"
          if [ -n "$KEYSTORE" ]; then formats="--apk --aab"; fi
          npx tauri android build $formats --target aarch64 --config src-tauri/tauri.version.json
      - name: Signieren
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir out
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Kein ANDROID_KEYSTORE-Secret: nur eine APK mit Wegwerf-Schlüssel, kein App-Bundle für Google Play"
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -storepass "$pass" -alias ctxremote \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Remocto"
          fi
          unsigned=$(find app/src-tauri/gen/android -name '*release*.apk' | head -1)
          "$tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --out out/Remocto.apk aligned.apk
          "$tools/apksigner" verify out/Remocto.apk
          if [ -n "$KEYSTORE" ]; then
            bundle=$(find app/src-tauri/gen/android -name '*release*.aab' | head -1)
            cp "$bundle" "out/Remocto-$CTXREMOTE_VERSION.aab"
            jarsigner -keystore release.jks -storepass "$pass" -sigalg SHA256withRSA -digestalg SHA-256 \
              "out/Remocto-$CTXREMOTE_VERSION.aab" ctxremote
            jarsigner -verify "out/Remocto-$CTXREMOTE_VERSION.aab"
          fi
          rm -f release.jks
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: out/

  deploy:
    needs: [version, server, client, client-macos, client-linux, client-android]
    runs-on: ubuntu-latest
    # Only from master, and only once the server is set up (docs/DEPLOY.md).
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Webinterface bauen
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Update signieren
        env:
          CTXREMOTE_UPDATE_SIGNING_KEY: ${{ secrets.CTXREMOTE_UPDATE_SIGNING_KEY }}
          HAS_ANDROID_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
          MSSTORE_URL: ${{ vars.MSSTORE_URL }}
          PLAY_URL: ${{ vars.PLAY_URL }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          chmod +x artifacts/server/ctxremote-server
          mkdir -p incoming
          cp artifacts/server/ctxremote-server deploy/remote-deploy.sh incoming/
          # The website with stable download names (published if setup-website.sh ran).
          cp -r website incoming/website
          printf '%s' "$VERSION" > incoming/VERSION
          mkdir -p incoming/download
          # Downloads get the setup window; the bare NSIS installer stays for updates.
          cp artifacts/client/Remocto-Setup.exe incoming/download/Remocto-Setup.exe
          if [ -f artifacts/client/Remocto-Hilfe.exe ]; then
            cp artifacts/client/Remocto-Hilfe.exe incoming/download/Remocto-Hilfe.exe
          fi
          if [ -f artifacts/client-macos/Remocto.dmg ]; then
            cp artifacts/client-macos/Remocto.dmg incoming/download/Remocto.dmg
          fi
          if [ -f artifacts/client-linux/Remocto.AppImage ]; then
            cp artifacts/client-linux/Remocto.AppImage artifacts/client-linux/remocto.deb incoming/download/
          fi
          # Android only with the real key: a throwaway one would break every update.
          if [ "$HAS_ANDROID_KEY" = true ] && [ -f artifacts/client-android/Remocto.apk ]; then
            cp artifacts/client-android/Remocto.apk incoming/download/Remocto.apk
          fi
          # Store links once the listings exist (variables MSSTORE_URL, PLAY_URL);
          # until then the download page offers the files directly.
          page=incoming/website/download.html
          if [ -n "$MSSTORE_URL" ]; then
            sed -i "s|__MSSTORE_URL__|$MSSTORE_URL|" "$page"
          else
            sed -i '/data-store>/d; s|class="btn" href="/download/Remocto-Setup.exe" download data-direct|class="btn btn-primary" href="/download/Remocto-Setup.exe" download data-direct|' "$page"
          fi
          if [ -z "$PLAY_URL" ] && [ ! -f incoming/download/Remocto.apk ]; then
            # No way to get the Android app yet: drop its card (the marker and 10 lines).
            sed -i '/data-android>/,+10d' "$page"
          fi
          if [ -n "$PLAY_URL" ]; then sed -i "s|__PLAY_URL__|$PLAY_URL|" "$page"; else sed -i '/data-play>/d' "$page"; fi
          [ -f incoming/download/Remocto.apk ] || sed -i '/data-apk>/d' "$page"
          if [ -n "$CTXREMOTE_UPDATE_SIGNING_KEY" ]; then
            artifacts/server/ctxremote-server update-sign \
              --platform windows-x86_64 --version "$VERSION" \
              --file "artifacts/client/Remocto-$VERSION-setup.exe" \
              --out incoming/updates --notes "$(printf '%s' "$NOTES" | head -n 1)"
          else
            echo "::warning::Kein CTXREMOTE_UPDATE_SIGNING_KEY: Client-Update wird nicht veröffentlicht."
          fi
      - name: Ausliefern
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER || 'ctxremote' }}@${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          ssh $ssh_opts "$TARGET" 'rm -rf ~/incoming'
          scp $ssh_opts -r incoming "$TARGET":incoming
          ssh $ssh_opts "$TARGET" 'bash ~/incoming/remote-deploy.sh'

  # Submits the MSIX to the Microsoft Store, only when the run was started by
  # hand with "store" ticked: every submission goes through certification, and
  # the store takes no new one while another is still being certified.
  # Setup (Partner Center app registration, secrets): docs/DEPLOY.md.
  store:
    needs: [version, client]
    if: github.event_name == 'workflow_dispatch' && inputs.store && vars.MSSTORE_PRODUCT_ID != ''
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-msix
          path: msix
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Anmelden
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
      - name: Einreichen
        shell: pwsh
        run: msstore publish "msix\Remocto-$env:VERSION-store.msix" --appId "${{ vars.MSSTORE_PRODUCT_ID }}"
