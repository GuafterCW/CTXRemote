# Builds a release from every push to master and delivers it:
#   1. the server (static Linux binary) to the VPS, with rollback if it does not start
#   2. the signed Windows installer to the server's update folder, from where
#      installed clients update themselves
#   3. the website (website/) with the newest installer and quick helper
# One-time setup (secrets, variables, server): docs/DEPLOY.md. Without the
# secrets the builds still run and the files are kept as workflow artifacts.
name: Release

# Pure documentation changes need no new release.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # major.minor from the workspace, the run number as patch: always increasing.
        run: |
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+)\..*/\1.\2/')
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  server:
    needs: version
    runs-on: ubuntu-latest
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # The mail transport's TLS (ring) compiles C code for the static build.
      - name: musl-Compiler
        run: sudo apt-get install -y -q musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked -p ctxremote-proto -p ctxremote-server
      - name: Server (statisch)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p ctxremote-server --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: target/x86_64-unknown-linux-musl/release/ctxremote-server

  client:
    needs: version
    runs-on: windows-latest
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      # Built into the clients: where they connect and which key updates must carry.
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      # The server's tunnel key: connections to the server are encrypted (docs/DEPLOY.md).
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: Dienst
        working-directory: app
        run: node scripts/prepare-service.mjs
      - name: Installer
        working-directory: app
        shell: bash
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --config src-tauri/tauri.version.json
      - name: Schnellhilfe
        if: vars.CTXREMOTE_SERVER != ''
        working-directory: app
        shell: bash
        env:
          CTXREMOTE_QUICK_SERVER: ${{ vars.CTXREMOTE_SERVER }}
        run: npm run build:quick -- --config src-tauri/tauri.version.json
      # The setup window for downloads (crates/setup) carries the NSIS
      # installer inside; automatic updates keep using the NSIS installer.
      - name: Setup-Fenster
        shell: bash
        run: |
          nsis=$(ls target/release/bundle/nsis/*-setup.exe)
          CTXREMOTE_SETUP_PAYLOAD="$PWD/$nsis" cargo build --release --locked -p ctxremote-setup
      - name: Dateien einsammeln
        shell: bash
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe "out/CTXRemote-$CTXREMOTE_VERSION-setup.exe"
          cp target/release/CTXRemote-Setup.exe out/CTXRemote-Setup.exe
          if [ -f target/release/CTXRemote-Hilfe.exe ]; then cp target/release/CTXRemote-Hilfe.exe out/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: out/

  # The macOS app as a disk image, for Apple silicon and Intel. Not signed or
  # notarised yet (needs an Apple developer account): on first start macOS
  # asks to confirm it (right-click → Open).
  client-macos:
    needs: version
    runs-on: macos-latest
    # Still new: a failing Mac build must not hold back the Windows release.
    continue-on-error: true
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: App
        working-directory: app
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.version.json
      - name: Dateien einsammeln
        run: |
          mkdir out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/CTXRemote.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: out/

  # Linux: an AppImage (runs on most distributions) and a .deb. Built on the
  # oldest supported Ubuntu, so the AppImage also runs on older systems.
  client-linux:
    needs: version
    runs-on: ubuntu-22.04
    # Still new: a failing Linux build must not hold back the Windows release.
    continue-on-error: true
    env:
      CTXREMOTE_VERSION: ${{ needs.version.outputs.version }}
      CTXREMOTE_DEFAULT_SERVER: ${{ vars.CTXREMOTE_SERVER }}
      CTXREMOTE_UPDATE_KEY: ${{ vars.CTXREMOTE_UPDATE_KEY }}
      CTXREMOTE_SERVER_KEY: ${{ vars.CTXREMOTE_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      - name: App
        working-directory: app
        run: |
          printf '{"version":"%s"}' "$CTXREMOTE_VERSION" > src-tauri/tauri.version.json
          npm run tauri build -- --config src-tauri/tauri.version.json
      - name: Dateien einsammeln
        run: |
          mkdir out
          cp target/release/bundle/appimage/*.AppImage out/CTXRemote.AppImage
          cp target/release/bundle/deb/*.deb out/ctxremote.deb
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux
          path: out/

  deploy:
    needs: [version, server, client, client-macos, client-linux]
    runs-on: ubuntu-latest
    # Only from master, and only once the server is set up (docs/DEPLOY.md).
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Webinterface bauen
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Update signieren
        env:
          CTXREMOTE_UPDATE_SIGNING_KEY: ${{ secrets.CTXREMOTE_UPDATE_SIGNING_KEY }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          chmod +x artifacts/server/ctxremote-server
          mkdir -p incoming
          cp artifacts/server/ctxremote-server deploy/remote-deploy.sh incoming/
          # The website with stable download names (published if setup-website.sh ran).
          cp -r website incoming/website
          printf '%s' "$VERSION" > incoming/VERSION
          mkdir -p incoming/download
          # Downloads get the setup window; the bare NSIS installer stays for updates.
          cp artifacts/client/CTXRemote-Setup.exe incoming/download/CTXRemote-Setup.exe
          if [ -f artifacts/client/CTXRemote-Hilfe.exe ]; then
            cp artifacts/client/CTXRemote-Hilfe.exe incoming/download/CTXRemote-Hilfe.exe
          fi
          if [ -f artifacts/client-macos/CTXRemote.dmg ]; then
            cp artifacts/client-macos/CTXRemote.dmg incoming/download/CTXRemote.dmg
          fi
          if [ -f artifacts/client-linux/CTXRemote.AppImage ]; then
            cp artifacts/client-linux/CTXRemote.AppImage artifacts/client-linux/ctxremote.deb incoming/download/
          fi
          if [ -n "$CTXREMOTE_UPDATE_SIGNING_KEY" ]; then
            artifacts/server/ctxremote-server update-sign \
              --platform windows-x86_64 --version "$VERSION" \
              --file "artifacts/client/CTXRemote-$VERSION-setup.exe" \
              --out incoming/updates --notes "$(printf '%s' "$NOTES" | head -n 1)"
          else
            echo "::warning::Kein CTXREMOTE_UPDATE_SIGNING_KEY: Client-Update wird nicht veröffentlicht."
          fi
      - name: Ausliefern
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ vars.DEPLOY_USER || 'ctxremote' }}@${{ vars.DEPLOY_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes"
          ssh $ssh_opts "$TARGET" 'rm -rf ~/incoming'
          scp $ssh_opts -r incoming "$TARGET":incoming
          ssh $ssh_opts "$TARGET" 'bash ~/incoming/remote-deploy.sh'
