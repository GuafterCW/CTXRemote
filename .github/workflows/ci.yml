# Checks without a release. GitHub Actions minutes are limited (Windows runners
# count twice, macOS ten times), so this runs only for pull requests or by hand
# (Actions → CI → Run workflow), on Linux only. Pushes to master are tested and
# built by release.yml anyway. Before pushing, run the checks from CLAUDE.md
# locally; scripts/check-windows.sh type-checks the Windows code from Linux.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: cargo test --locked -p ctxremote-proto -p ctxremote-core -p ctxremote-server
      - name: App-Oberfläche
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      # The web interface: types, build, and that the browser derives the same keys as the app.
      - name: Webinterface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Windows-Code (Typprüfung von Linux aus)
        run: ./scripts/check-windows.sh
