# Checks for every push and pull request. The repository is public, so the
# standard runners cost nothing. Pushes to master are also tested and built by
# release.yml.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build

      - name: Tests
        run: cargo test --locked -p ctxremote-proto -p ctxremote-core -p ctxremote-server -p ctxremote-setup

      - name: Dienst für den Installer (nur Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: node scripts/prepare-service.mjs

      - name: App
        run: cargo build --locked -p ctxremote

      - name: Setup-Fenster
        run: cargo build --locked -p ctxremote-setup

      # A disk image to try the Mac app from any branch (unsigned: right-click → Open).
      - name: Mac-Disk-Image zum Testen
        if: runner.os == 'macOS'
        working-directory: app
        run: npm run tauri build -- --bundles dmg
      - name: Mac-Disk-Image ablegen
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CTXRemote-macOS
          path: target/release/bundle/dmg/*.dmg
          retention-days: 14

  # The Android viewer as an installable, optimised APK. Signed with the key in
  # the secrets ANDROID_KEYSTORE (base64) and ANDROID_KEYSTORE_PASSWORD, else
  # with a throwaway key (then an update needs the old app removed first).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: npm ci
      # The runner's NDK path is a shell variable, not part of the `env` context.
      - name: NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
      - name: Android-Projekt anlegen
        working-directory: app
        run: npx tauri android init --ci
      - name: APK
        working-directory: app
        run: npx tauri android build --apk --target aarch64
      - name: APK signieren
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Kein ANDROID_KEYSTORE-Secret: APK mit Wegwerf-Schlüssel signiert"
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -storepass "$pass" -alias ctxremote \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=CTXRemote"
          fi
          unsigned=$(find app/src-tauri/gen/android -name '*release*.apk' | head -1)
          echo "APK: $unsigned"
          mkdir out
          "$tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --out out/CTXRemote.apk aligned.apk
          "$tools/apksigner" verify out/CTXRemote.apk
          rm -f release.jks
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: CTXRemote-Android
          path: out/CTXRemote.apk
          retention-days: 14

  # The web interface (website/konto): types, build, and the check that the
  # browser derives the same keys as the app.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Webinterface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
