[package]
name = "ctxremote-core"
description = "Host and viewer engine of CTXRemote: capture, encoding, input, sessions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctxremote-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
bytes.workspace = true
postcard.workspace = true
tokio-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
openh264 = "0.9"
openh264-sys2 = "0.9"
directories = "6"
whoami = "1"
png = "0.18"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
base64 = "0.22"
argon2 = "0.5"
opus-rs = "0.1.34"
sha1 = "0.10"
hmac = "0.12"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
]

[dev-dependencies]
tokio.workspace = true

# Phones have no arboard; their clipboard comes later through the app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }

# Linux host on X11: picture (MIT-SHM), input (XTest), monitors (RandR), pointer (XFixes).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "xtest", "randr", "xfixes"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
block2 = "0.6"
