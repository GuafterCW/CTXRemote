[package]
name = "ctxremote-server"
description = "Self-hosted rendezvous and relay server for CTXRemote"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctxremote-proto.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }

[dev-dependencies]
ctxremote-core.workspace = true
serde_json.workspace = true
