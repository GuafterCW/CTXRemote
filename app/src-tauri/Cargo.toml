[package]
name = "ctxremote"
description = "CTXRemote desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The app is a library as well, which is what Android and iOS load.
[lib]
name = "ctxremote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ctxremote-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Only registered on phones (desktop has arboard in core); a dependency everywhere
# so its permissions are known to every build.
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[features]
# Portable "CTXRemote Hilfe" build; needs CTXREMOTE_QUICK_SERVER at compile time.
quick = []
